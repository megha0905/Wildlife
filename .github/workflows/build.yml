# Builds and tests every WildGuard module on each push and pull request.
# If a module fails, its error lines are attached to the run as annotations (visible on the run page).
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, habitat-service, wildlife-service, resource-service,
                  patrol-service, incident-service, rescue-service, programme-service, reporting-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: mvn verify
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          {
            grep -E '\[ERROR\]|Tests run:.*Fail|expected|but was|Caused by' build.log | grep -v 'Help 1\|-e switch\|-X switch\|^\[ERROR\] *$\|full stack trace\|Re-run Maven\|For more information' | head -60
            for f in target/surefire-reports/*.txt; do [ -f "$f" ] && grep -A12 -E 'FAILURE|ERROR' "$f" | head -40; done
          } > errors.txt || true
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=${{ matrix.service }} failed::$msg"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: install and build
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          npm run build 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E 'error' build.log | head -40 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=frontend failed::$msg"
