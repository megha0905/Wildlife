server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: habitat-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:habitat_db}
    username: ${DB_USERNAME:wildguard}
    password: ${DB_PASSWORD:wildguard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Kolkata}
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}

security:
  jwt:
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
