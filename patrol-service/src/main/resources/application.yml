server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: patrol-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:patrol_db}
    username: ${DB_USERNAME:wildguard}
    password: ${DB_PASSWORD:wildguard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Kolkata}
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}

security:
  jwt:
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Other services this one calls (CONTRACTS.md 8)
services:
  habitat:
    url: ${HABITAT_SERVICE_URL:http://localhost:8082}
  wildlife:
    url: ${WILDLIFE_SERVICE_URL:http://localhost:8083}
  resource:
    url: ${RESOURCE_SERVICE_URL:http://localhost:8084}
  incident:
    url: ${INCIDENT_SERVICE_URL:http://localhost:8086}
