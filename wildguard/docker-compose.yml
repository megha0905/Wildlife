# WildGuard local infrastructure: PostgreSQL only.
# Start:  docker compose up -d
# Stop:   docker compose down        (data is kept in the named volume)
# Reset:  docker compose down -v     (deletes all data; databases are re-created on next start)

services:
  postgres:
    image: postgres:16-alpine
    container_name: wildguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wildguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildguard}
      POSTGRES_DB: postgres
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
      PGTZ: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - wildguard-pgdata:/var/lib/postgresql/data
      # Runs only the first time the volume is created
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wildguard} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wildguard-pgdata:
